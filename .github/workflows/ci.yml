name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run typecheck
      - run: pnpm run build

  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [agent, crawler, demo-sites]
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f ${{ matrix.service }}/Dockerfile -t pixel-patrol-${{ matrix.service }} .
      - name: Check agent runtime dependencies and shared data
        if: matrix.service == 'agent'
        run: |
          docker run --rm --workdir /app/agent --entrypoint node pixel-patrol-agent --input-type=module -e '
            import assert from "node:assert/strict";
            import { createRequire } from "node:module";
            import { allTrackers, allCookies } from "@pixel-patrol/shared";
            await import("./dist/server.js");
            assert.ok(allTrackers().length > 0);
            assert.ok(allCookies().length > 0);
            assert.throws(() => createRequire(import.meta.url).resolve("playwright"));
            console.log("agent imports and shared data pass; crawler dependency excluded");
          '
      - name: Check crawler runtime dependencies, shared data and Chromium
        if: matrix.service == 'crawler'
        run: |
          docker run --rm --workdir /app/crawler --entrypoint node pixel-patrol-crawler --input-type=module -e '
            import assert from "node:assert/strict";
            import { createRequire } from "node:module";
            import { chromium } from "playwright";
            import { allTrackers, allCookies } from "@pixel-patrol/shared";
            await import("./dist/crawler.js");
            await import("./dist/sinks.js");
            assert.ok(allTrackers().length > 0);
            assert.ok(allCookies().length > 0);
            assert.throws(() => createRequire(import.meta.url).resolve("@google/adk"));
            const browser = await chromium.launch({ headless: true });
            try {
              const page = await browser.newPage();
              await page.setContent("<title>pixel patrol smoke</title>");
              assert.equal(await page.title(), "pixel patrol smoke");
            } finally {
              await browser.close();
            }
            console.log("crawler imports, shared data and Chromium pass; agent dependency excluded");
          '
      - name: Check demo HTTP server and pages
        if: matrix.service == 'demo-sites'
        run: |
          docker run --rm --entrypoint node pixel-patrol-demo-sites --input-type=module -e '
            import assert from "node:assert/strict";
            import { spawn } from "node:child_process";
            import { once } from "node:events";
            const server = spawn(process.execPath, ["dist/server.js"], { stdio: ["ignore", "pipe", "inherit"] });
            const exited = once(server, "exit");
            try {
              await Promise.race([
                once(server.stdout, "data"),
                exited.then(() => { throw new Error("server exited before listening"); }),
              ]);
              for (const path of ["/healthz", "/boutique/", "/atelier/"]) {
                const response = await fetch(`http://127.0.0.1:8080${path}`, { signal: AbortSignal.timeout(5000) });
                assert.equal(response.status, 200);
                assert.ok((await response.text()).length > 0);
              }
            } finally {
              server.kill();
              await exited;
            }
            console.log("demo HTTP and pages pass");
          '
