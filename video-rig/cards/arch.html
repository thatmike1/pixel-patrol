<p>Cloud Scheduler fans out one Pub/Sub message per site, and a Cloud Run Job crawls that site
with Playwright. The diff itself is plain code the model cannot reach around. Two Gemini agents
on Vertex do the judgement: is this real drift, and what does the policy now have to say.</p>
