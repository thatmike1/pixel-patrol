<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1040" width="1200" height="1040" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Pixel Patrol architecture</title>
  <desc>One scheduled tick becomes a crawl, a deterministic diff, two Gemini agents and a filed ticket. Judgement lives in the agents; everything that must be exactly right is code.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="1040" fill="#ffffff"/>

  <!-- ── title ─────────────────────────────────────────────────────────── -->
  <text x="40" y="46" font-size="27" font-weight="700" fill="#0f172a">Pixel Patrol</text>
  <text x="40" y="70" font-size="14.5" fill="#475569">GDPR drift watchdog. A scheduled tick becomes a crawl, a deterministic diff, two Gemini</text>
  <text x="40" y="88" font-size="14.5" fill="#475569">agents and a filed ticket, with no human step inside the run.</text>
  <text x="40" y="108" font-size="13" fill="#64748b">Google Cloud, europe-west1. Gemini 3.5 Flash on Vertex AI, global endpoint.</text>

  <!-- ── legend ────────────────────────────────────────────────────────── -->
  <g font-size="12" fill="#334155">
    <rect x="852" y="34" width="26" height="16" rx="4" fill="#eef2f7" stroke="#64748b" stroke-width="1.4"/>
    <text x="888" y="46">deterministic code, no model involved</text>
    <rect x="852" y="58" width="26" height="16" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.4"/>
    <text x="888" y="70">Gemini 3.5 Flash agent (ADK LlmAgent)</text>
    <rect x="852" y="82" width="26" height="16" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"/>
    <text x="888" y="94">managed Google Cloud service</text>
  </g>

  <!-- ── column headers ────────────────────────────────────────────────── -->
  <g font-size="11.5" font-weight="700" fill="#94a3b8" letter-spacing="1.2">
    <text x="40" y="134">TRIGGER, MESSAGING, TARGET</text>
    <text x="330" y="134">PIPELINE</text>
    <text x="840" y="134">STATE, CREDENTIALS, DELIVERY</text>
  </g>
  <line x1="40" y1="142" x2="1160" y2="142" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ══ row 1: the tick ═══════════════════════════════════════════════ -->
  <g>
    <rect x="40" y="152" width="210" height="46" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"/>
    <text x="56" y="172" font-size="14" font-weight="700" fill="#0c4a6e">Cloud Scheduler</text>
    <text x="56" y="189" font-size="11.5" fill="#0369a1">sweep-tick · 0 * * * *</text>

    <rect x="40" y="210" width="210" height="46" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"/>
    <text x="56" y="230" font-size="14" font-weight="700" fill="#0c4a6e">Pub/Sub · sweep-tick</text>
    <text x="56" y="247" font-size="11.5" fill="#0369a1">push, OIDC token per endpoint</text>

    <path d="M 145 198 L 145 208" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
    <path d="M 250 233 L 324 205" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

    <rect x="330" y="162" width="430" height="80" rx="10" fill="#eef2f7" stroke="#64748b" stroke-width="1.6"/>
    <text x="748" y="180" font-size="10.5" fill="#94a3b8" text-anchor="end">patrol-agent · Cloud Run service</text>
    <text x="350" y="200" font-size="15" font-weight="700" fill="#0f172a">POST /trigger/tick</text>
    <text x="350" y="219" font-size="12" fill="#475569">reads the site register, publishes one message per enabled site</text>
    <text x="350" y="235" font-size="12" fill="#475569">a site whose crawl fails cannot stall the rest of the fleet</text>
  </g>

  <!-- ══ row 2: one message per site ═══════════════════════════════════ -->
  <g>
    <rect x="40" y="272" width="210" height="46" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"/>
    <text x="56" y="292" font-size="14" font-weight="700" fill="#0c4a6e">Pub/Sub · site-sweep</text>
    <text x="56" y="309" font-size="11.5" fill="#0369a1">one message per site</text>

    <rect x="40" y="326" width="210" height="34" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.3" stroke-dasharray="5 3"/>
    <text x="56" y="342" font-size="12" font-weight="700" fill="#92400e">DLQ · site-sweep-dlq</text>
    <text x="56" y="355" font-size="10.5" fill="#b45309">after 5 attempts, 7d retention</text>

    <path d="M 145 318 L 145 324" stroke="#b45309" stroke-width="1.3" fill="none" marker-end="url(#arrow-amber)"/>
    <path d="M 400 242 L 400 264 L 145 264 L 145 270" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
    <path d="M 250 295 L 324 315" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

    <rect x="330" y="282" width="430" height="66" rx="10" fill="#eef2f7" stroke="#64748b" stroke-width="1.6"/>
    <text x="748" y="300" font-size="10.5" fill="#94a3b8" text-anchor="end">patrol-agent · Cloud Run service</text>
    <text x="350" y="320" font-size="15" font-weight="700" fill="#0f172a">POST /trigger/site-sweep</text>
    <text x="350" y="339" font-size="12" fill="#475569">starts one Cloud Run Job execution and lets go: a crawl outlives a push</text>
  </g>

  <!-- ══ row 3: the crawl ══════════════════════════════════════════════ -->
  <g>
    <rect x="40" y="398" width="210" height="76" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"/>
    <text x="56" y="418" font-size="14" font-weight="700" fill="#0c4a6e">demo-sites</text>
    <text x="56" y="435" font-size="11.5" fill="#0369a1">Cloud Run service, public</text>
    <text x="56" y="451" font-size="11.5" fill="#0369a1">five watched pages loading</text>
    <text x="56" y="466" font-size="11.5" fill="#0369a1">real third-party tag scripts</text>

    <path d="M 250 430 L 324 430" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
    <text x="256" y="422" font-size="10.5" fill="#64748b">plain HTTP</text>
    <path d="M 400 348 L 400 380" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

    <rect x="330" y="388" width="430" height="92" rx="10" fill="#eef2f7" stroke="#64748b" stroke-width="1.6"/>
    <text x="748" y="406" font-size="10.5" fill="#94a3b8" text-anchor="end">Cloud Run Job</text>
    <text x="350" y="426" font-size="15" font-weight="700" fill="#0f172a">patrol-crawler · Playwright</text>
    <text x="350" y="445" font-size="12" fill="#475569">crawls five pages, clicks through the consent banner, records</text>
    <text x="350" y="461" font-size="12" fill="#475569">third-party hosts by registrable domain and cookies pre and post</text>
    <text x="350" y="477" font-size="12" fill="#475569">consent, then publishes sweep-done</text>
  </g>

  <!-- ══ row 4: the deterministic diff ═════════════════════════════════ -->
  <g>
    <rect x="40" y="520" width="210" height="46" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"/>
    <text x="56" y="540" font-size="14" font-weight="700" fill="#0c4a6e">Pub/Sub · sweep-done</text>
    <text x="56" y="557" font-size="11.5" fill="#0369a1">300s ack, the analyst runs behind it</text>

    <rect x="40" y="574" width="210" height="34" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.3" stroke-dasharray="5 3"/>
    <text x="56" y="590" font-size="12" font-weight="700" fill="#92400e">DLQ · sweep-done-dlq</text>
    <text x="56" y="603" font-size="10.5" fill="#b45309">after 5 attempts, 7d retention</text>

    <path d="M 145 566 L 145 572" stroke="#b45309" stroke-width="1.3" fill="none" marker-end="url(#arrow-amber)"/>
    <path d="M 400 480 L 400 500 L 145 500 L 145 518" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
    <path d="M 250 543 L 324 560" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

    <rect x="330" y="520" width="430" height="88" rx="10" fill="#eef2f7" stroke="#64748b" stroke-width="1.6"/>
    <text x="748" y="538" font-size="10.5" fill="#94a3b8" text-anchor="end">patrol-agent · Cloud Run service</text>
    <text x="350" y="558" font-size="15" font-weight="700" fill="#0f172a">POST /trigger/sweep-done · diff + stability window</text>
    <text x="350" y="577" font-size="12" fill="#475569">set difference against the approved baseline, then every entry classified</text>
    <text x="350" y="593" font-size="12" fill="#475569">against the site's own last N=5 sweeps: new, returning and gone alert;</text>
    <text x="350" y="605" font-size="12" fill="#475569">flapping, missing-once and pending do not</text>
  </g>

  <!-- ══ row 5: the analyst ════════════════════════════════════════════ -->
  <g>
    <path d="M 545 608 L 545 636" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

    <rect x="330" y="644" width="430" height="94" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.4"/>
    <text x="748" y="662" font-size="10.5" fill="#8b5cf6" text-anchor="end">ADK LlmAgent · gemini-3.5-flash</text>
    <text x="350" y="682" font-size="15" font-weight="700" fill="#2e1065">drift analyst</text>
    <text x="350" y="701" font-size="12" fill="#4c1d95">five FunctionTools. Reads the split it may not redraw, looks up what the</text>
    <text x="350" y="717" font-size="12" fill="#4c1d95">vendor tables know about each domain that appeared, and records one</text>
    <text x="350" y="733" font-size="12" fill="#4c1d95">verdict: noop, drift, or baseline-created. Names no vendor it cannot ground.</text>
  </g>

  <!-- ══ row 6: the scribe ═════════════════════════════════════════════ -->
  <g>
    <path d="M 545 738 L 545 764" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
    <text x="556" y="756" font-size="11" fill="#64748b">only on drift</text>

    <rect x="330" y="772" width="430" height="80" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.4"/>
    <text x="748" y="790" font-size="10.5" fill="#8b5cf6" text-anchor="end">ADK LlmAgent · gemini-3.5-flash</text>
    <text x="350" y="810" font-size="15" font-weight="700" fill="#2e1065">compliance scribe</text>
    <text x="350" y="829" font-size="12" fill="#4c1d95">writes the Czech cookie-policy redline naming each vendor's cookies and</text>
    <text x="350" y="845" font-size="12" fill="#4c1d95">their durations, plus the RoPA row the change obliges the owner to file</text>
  </g>

  <!-- ══ row 7: the notifier ═══════════════════════════════════════════ -->
  <g>
    <path d="M 545 852 L 545 878" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

    <rect x="330" y="886" width="430" height="76" rx="10" fill="#eef2f7" stroke="#64748b" stroke-width="1.6"/>
    <text x="748" y="904" font-size="10.5" fill="#94a3b8" text-anchor="end">patrol-agent · Cloud Run service</text>
    <text x="350" y="924" font-size="15" font-weight="700" fill="#0f172a">notifier · deterministic, idempotent per sweepId</text>
    <text x="350" y="943" font-size="12" fill="#475569">the outcome is read before anything is sent, and each half is recorded</text>
    <text x="350" y="959" font-size="12" fill="#475569">separately, so a redelivery sends only what did not go out</text>
  </g>

  <!-- ══ right column: Firestore ═══════════════════════════════════════ -->
  <g>
    <rect x="840" y="388" width="320" height="464" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
    <text x="1140" y="410" font-size="10.5" fill="#34d399" text-anchor="end">Firestore, native mode</text>
    <text x="862" y="430" font-size="15" font-weight="700" fill="#064e3b">the whole state of the system</text>
    <text x="862" y="452" font-size="12" fill="#047857">Every step reads and writes here, and nothing else</text>
    <text x="862" y="468" font-size="12" fill="#047857">is held in memory between deliveries.</text>

    <g font-size="12.5" fill="#065f46">
      <text x="862" y="504" font-weight="700">sites/{siteId}</text>
      <text x="878" y="522" fill="#047857">url, owner email, enabled, approved baseline,</text>
      <text x="878" y="538" fill="#047857">pending domains and cookies</text>
      <text x="862" y="568" font-weight="700">…/fingerprints/{sweepId}</text>
      <text x="878" y="586" fill="#047857">what the crawler saw, hashed</text>
      <text x="862" y="616" font-weight="700">…/decisions/{sweepId}</text>
      <text x="878" y="634" fill="#047857">the analyst's verdict and its classifications</text>
      <text x="862" y="664" font-weight="700">…/redlines/{sweepId}</text>
      <text x="878" y="682" fill="#047857">the scribe's Czech redline and RoPA row</text>
      <text x="862" y="712" font-weight="700">…/notifications/{sweepId}</text>
      <text x="878" y="730" fill="#047857">what left the system, and what failed to</text>
    </g>

    <text x="862" y="776" font-size="12" fill="#047857">The sweep id is the idempotency key throughout.</text>
    <text x="862" y="794" font-size="12" fill="#047857">A Pub/Sub redelivery re-runs the analysis and</text>
    <text x="862" y="812" font-size="12" fill="#047857">stops at the notification that already exists,</text>
    <text x="862" y="830" font-size="12" fill="#047857">so one finding is filed exactly once.</text>

    <path d="M 762 434 L 834 434" stroke="#0f766e" stroke-width="1.4" stroke-dasharray="5 3" fill="none" marker-end="url(#arrow-dash)"/>
    <text x="798" y="426" font-size="10" fill="#0f766e" text-anchor="middle">fingerprint</text>
    <path d="M 762 564 L 834 564" stroke="#0f766e" stroke-width="1.4" stroke-dasharray="5 3" fill="none" marker-end="url(#arrow-dash)"/>
    <text x="798" y="556" font-size="10" fill="#0f766e" text-anchor="middle">history</text>
    <path d="M 762 688 L 834 688" stroke="#0f766e" stroke-width="1.4" stroke-dasharray="5 3" fill="none" marker-end="url(#arrow-dash)"/>
    <text x="798" y="680" font-size="10" fill="#0f766e" text-anchor="middle">decision</text>
    <path d="M 762 812 L 834 812" stroke="#0f766e" stroke-width="1.4" stroke-dasharray="5 3" fill="none" marker-end="url(#arrow-dash)"/>
    <text x="798" y="804" font-size="10" fill="#0f766e" text-anchor="middle">redline</text>
  </g>

  <!-- ══ right column: secrets and delivery ════════════════════════════ -->
  <g>
    <rect x="840" y="872" width="320" height="40" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"/>
    <text x="856" y="890" font-size="13.5" font-weight="700" fill="#0c4a6e">Secret Manager</text>
    <text x="856" y="905" font-size="11" fill="#0369a1">GitHub token and Resend key, mounted at instance start</text>
    <path d="M 838 892 L 766 900" stroke="#475569" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>

    <rect x="840" y="926" width="155" height="66" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.4"/>
    <text x="854" y="946" font-size="13" font-weight="700" fill="#0f172a">GitHub issue</text>
    <text x="854" y="963" font-size="11" fill="#475569">pixel-patrol-tickets,</text>
    <text x="854" y="978" font-size="11" fill="#475569">redline in the body</text>

    <rect x="1005" y="926" width="155" height="66" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.4"/>
    <text x="1019" y="946" font-size="13" font-weight="700" fill="#0f172a">Email to the owner</text>
    <text x="1019" y="963" font-size="11" fill="#475569">Resend, from a verified</text>
    <text x="1019" y="978" font-size="11" fill="#475569">sending domain</text>

    <path d="M 762 940 L 834 950" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
    <path d="M 762 952 L 999 962" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  </g>

  <!-- ══ footer ════════════════════════════════════════════════════════ -->
  <text x="40" y="1012" font-size="12" fill="#64748b">Judgement lives in the two purple boxes. Everything that has to be exactly right, reading fingerprints, computing the difference, deciding what is noise, filing the ticket, is code the model cannot reach around.</text>
</svg>
